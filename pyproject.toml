[project]
name = "bock-and-bros"
version = "0.1.0"
description = "A Lisbon bars and cafes meetup app"
requires-python = ">=3.10"
dependencies = [
    "streamlit[auth]",
]

[dependency-groups]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-p no:cacheprovider"
